---
default_language_version:
  python: python3.12

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: conventional-pre-commit
        name: Lint commit messages
        entry: conventional-pre-commit
        language: python
        stages: [commit-msg]

      - id: trailing-whitespace
        stages: [pre-commit]
        name: Trim Trailing Whitespace
        entry: trailing-whitespace-fixer
        exclude: docs/docs
        language: python
        types: [text]

      - id: end-of-file-fixer
        stages: [pre-commit]
        name: Add a blank line at end of a file
        entry: end-of-file-fixer
        exclude: docs/docs
        language: python
        types: [text]

      - id: mixed-line-ending
        stages: [pre-commit]
        name: Ensure line feed character (LF)
        entry: mixed-line-ending
        language: python
        types: [text]
        args: [--fix=lf]

      - id: check-yaml
        stages: [pre-commit]
        name: Check yaml
        entry: check-yaml
        language: python
        types: [yaml]
        args: [--unsafe]

      - id: yamllint
        stages: [pre-commit]
        name: Lint yaml files
        entry: yamllint
        language: python
        types: [yaml]
        args: [--strict]

      - id: shellcheck
        name: Lint shell scripts
        entry: shellcheck
        language: python
        types: [shell]
        stages: [pre-commit]

      - id: hadolint
        name: Lint Dockerfiles
        entry: >-
          ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          hadolint
        language: docker_image
        stages: [pre-commit]
        types: [dockerfile]

      - id: zizmor
        stages: [pre-commit]
        name: Lint GitHub Actions workflows
        entry: zizmor
        language: python
        types: [yaml]
        # The inputs zizmor supports.
        files: |
          (?x)(^|/)(
            \.github/(workflows/[^/]+|dependabot)\.ya?ml
            |action\.ya?ml
            |\.pre-commit-(config|hooks)\.ya?ml
          )$
        require_serial: true
        args: [--no-progress]

  # Formatters should be run late so that they can re-format
  # any prior changes
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 5c04180ee080cf187369bcc7fd720c253687386c  # frozen: v3.11.0-1
    hooks:
      - id: shfmt-docker
        name: Format shell scripts
        args: [--write, --simplify, --indent=4]
        stages: [pre-commit]
        types: [shell]
