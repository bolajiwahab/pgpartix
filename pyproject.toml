[project]
name = "pgpartix"
version = "0.16.2"
requires-python = ">=3.12"
dependencies = [
    "check-jsonschema==0.39.0",
    "pgrubic==4.1.1",
]

[dependency-groups]
dev = [
    "conventional-pre-commit==4.5.0",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0",
    "shellcheck-py==0.11.0.1",
    "yamllint==1.38.0",
    "zizmor==1.32.0",
]
tooling = [
    "uv==0.13.8",
]
docs = [
    "zensical==0.1.1",
]
release = [
    "commitizen==4.19.3",
]

[tool.uv]
package = false

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
# Matches the release workflow's tags, such as 0.17.0 and 0.17.0rc1.
version_scheme = "pep440"
version_provider = "uv"
# Breaking changes bump the minor version until pgpartix reaches 1.0.0.
major_version_zero = true
update_changelog_on_bump = true
annotated_tag = true
bump_message = "chore(release): release $new_version"
breaking_change_exclamation_in_title = true
# The image tags and reusable workflow references in the docs, such as
# ghcr.io/bolajiwahab/pgpartix:0.16.1-pg18 and
# bolajiwahab/pgpartix/.github/workflows/partition-lifecycle.yaml@0.16.1.
version_files = [
    "README.md:bolajiwahab/pgpartix",
    "docs/docs/getting-started.md:bolajiwahab/pgpartix",
    "docs/docs/github-actions.md:bolajiwahab/pgpartix",
]
