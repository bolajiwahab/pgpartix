---
# yamllint disable rule:line-length
name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"  # Run daily at midnight UTC

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    name: Run pre-commit
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      - name: Install and run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1

  coverage:
    runs-on: ubuntu-latest
    name: Run coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Run coverage
        env:
          COVERAGE: true
        run: tests/run-tests.sh

  test-postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql:
          - 14
          - 15
          - 16
          - 17
          - 18
    name: Run tests on PostgreSQL ${{ matrix.postgresql }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Run tests on PostgreSQL ${{ matrix.postgresql }}
        env:
          PG_MAJOR_VERSION: ${{ matrix.postgresql }}
        run: tests/run-tests.sh

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Run integration test
        run: tests/run-integration-test.sh

  ensure-up-to-date-schema-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Ensure schema doc is up to date
        run: tools/ensure_up_to_date_schema_doc.sh
