---
# yamllint disable rule:line-length
name: release

on:  # yamllint disable-line rule:truthy
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

env:
  PACKAGE_NAME: "pgpartix"
  LATEST_POSTGRESQL_VERSION: "18"

jobs:
  details:
    name: Extract tag details
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.release.outputs.new_version }}
      suffix: ${{ steps.release.outputs.suffix }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-tags: true

      - name: Extract tag details
        id: release
        run: |
            if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            NEW_VERSION=$(echo $TAG_NAME | awk -F'-' '{print $1}')
            SUFFIX=$(echo $TAG_NAME | grep -oP '[a-z]+[0-9]+' || echo "")
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "Version is $NEW_VERSION"
            echo "Suffix is $SUFFIX"
            echo "Tag name is $TAG_NAME"
            else
            echo "No tag found"
            exit 1
            fi

  github_release:
    name: Create GitHub Release
    needs: [details]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
            gh release create ${{ needs.details.outputs.tag_name }} --title ${{ needs.details.outputs.tag_name }} --generate-notes

  docker_image_release:
    name: Publish PostgreSQL ${{ matrix.postgresql }} image [arch=amd64,arm64]
    needs: [details]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: [14, 15, 16, 17, 18]
    permissions:
      contents: read
      packages: write
    environment:
      name: release
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for Arm
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Define image tags
        id: image-tags
        env:
          POSTGRESQL: ${{ matrix.postgresql }}
          RELEASE_TAG: ${{ needs.details.outputs.tag_name }}
          RELEASE_SUFFIX: ${{ needs.details.outputs.suffix }}
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}:${RELEASE_TAG}-pg${POSTGRESQL}"
            if [[ "${POSTGRESQL}" == "${LATEST_POSTGRESQL_VERSION}" && -z "${RELEASE_SUFFIX}" ]]; then
              echo "ghcr.io/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          target: runtime
          platforms: linux/amd64,linux/arm64
          build-args: PG_MAJOR_VERSION=${{ matrix.postgresql }}
          cache-from: type=gha,scope=release-pg${{ matrix.postgresql }}
          cache-to: type=gha,scope=release-pg${{ matrix.postgresql }},mode=max
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}

      - name: Post Image URL
        run: echo "Docker image published at ghcr.io/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}:${{ needs.details.outputs.tag_name }}-pg${{ matrix.postgresql }}"
