---
# yamllint disable rule:line-length
# Integration tests for the runtime image: pgp-run-lifecycle against a dedicated
# PostgreSQL container, the way an application's own database would be reached,
# and against an ephemeral cluster started from a container running as root.
#
# Usage: tests/run-integration-test.sh
services:
  postgres:
    # Reuse the digest-pinned PostgreSQL stage so Renovate maintains each pin
    # in the Dockerfile.
    build:
      context: ..
      dockerfile: Dockerfile
      target: postgres${PG_MAJOR_VERSION:-18}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./fixtures/external_db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  pgpartix:
    build: &runtime-build
      context: ..
      dockerfile: Dockerfile
      target: runtime
      args:
        PG_MAJOR_VERSION: ${PG_MAJOR_VERSION:-18}
    depends_on:
      postgres:
        condition: service_healthy
    # The image runs as an unprivileged user by default. /repository is a bind
    # mount of the host directory, owned by whatever user checked it out (the
    # CI runner's own user, or the local developer) - not the image's
    # pgpuser - so writes need root here.
    user: root
    environment:
      PGP_HOST: postgres
      PGP_PORT: "5432"
      PGP_USER: postgres
      PGP_PASSWORD: postgres
      PGP_DATABASE: postgres
    volumes:
      - ..:/repository
    working_dir: /repository
    command:
      - bash
      - -lc
      - |
        pgp-run-lifecycle -c tests/fixtures/external_db/partition-lifecycle.yaml

  # The container runs as root and starts the ephemeral cluster as pgpuser.
  pgpartix-ephemeral:
    build: *runtime-build
    user: root
    environment:
      PGP_INIT_DIR: examples/quick-start/initdir
    volumes:
      - ..:/repository
    working_dir: /repository
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        runuser -u pgpuser -- pgp-start
        pgp-run-lifecycle -c examples/quick-start/partition-lifecycle.yaml
